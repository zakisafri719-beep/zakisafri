<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  :root {
    --bg-main: #0a0618;
    --bg-sidebar: #0f0a24;
    --bg-user-bubble: #7c3aed;
    --bg-bot-bubble: #15102e;
    --bg-input: #1a1436;
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --purple-glow: #8b5cf6;
    --text: #f0ecff;
    --text-muted: #8b85a8;
    --border: #241d47;
  }

  body {
    background: var(--bg-main);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ===== القائمة الجانبية الضيقة ===== */
  .sidebar {
    width: 65px;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0;
    gap: 8px;
    border-left: 1px solid var(--border);
  }

  .side-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-muted);
  }

  .side-icon:hover {
    background: var(--bg-bot-bubble);
    color: var(--text);
  }

  .side-icon.active {
    background: rgba(124, 58, 237, 0.25);
    color: var(--purple-light);
  }

  .sidebar .spacer { flex: 1; }

  /* ===== المنطقة الرئيسية ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ===== الشريط العلوي ===== */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 25px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 10, 36, 0.5);
    backdrop-filter: blur(10px);
  }

  .top-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .top-logo {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
  }

  .top-text h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .top-text p {
    font-size: 11px;
    color: #22c55e;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .top-text p::before {
    content: '';
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px #22c55e;
  }

  .top-actions {
    display: flex;
    gap: 8px;
  }

  .top-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .top-btn:hover {
    background: var(--bg-bot-bubble);
    color: var(--text);
  }

  /* ===== منطقة الرسائل ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px 30px 120px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .chat-area::-webkit-scrollbar-thumb:hover { background: var(--purple); }

  .messages {
    max-width: 850px;
    margin: 0 auto;
  }

  /* ===== رسالة ===== */
  .msg {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    font-weight: 600;
  }

  .msg.user .msg-avatar {
    background: linear-gradient(135deg, #f093fb, #a855f7);
    color: white;
  }

  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
    color: white;
  }

  .msg-bubble {
    flex: 1;
    max-width: calc(100% - 60px);
  }

  .msg-content {
    background: var(--bg-bot-bubble);
    padding: 16px 20px;
    border-radius: 16px;
    line-height: 1.8;
    font-size: 14.5px;
    word-wrap: break-word;
    white-space: pre-wrap;
    border: 1px solid var(--border);
  }

  .msg.user .msg-content {
    background: var(--bg-user-bubble);
    border: none;
    color: white;
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .msg.user .msg-bubble {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    padding: 0 5px;
  }

  /* أزرار تحت رسالة البوت */
  .msg-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    padding: 0 5px;
  }

  .msg-action-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .msg-action-btn:hover {
    background: var(--bg-bot-bubble);
    color: var(--text);
  }

  /* ===== شاشة الترحيب ===== */
  .welcome {
    text-align: center;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
  }

  .welcome-avatar {
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 40px rgba(124, 58, 237, 0.6);
  }

  .welcome-bubble {
    background: var(--bg-bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 25px;
    text-align: right;
    line-height: 1.9;
    font-size: 15px;
    color: var(--text);
  }

  .welcome-bubble h2 {
    font-size: 18px;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .chip {
    background: rgba(124, 58, 237, 0.15);
    border: 1px solid var(--purple);
    color: var(--purple-light);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chip:hover {
    background: rgba(124, 58, 237, 0.3);
    transform: translateY(-2px);
  }

  /* ===== شريط الإدخال العائم ===== */
  .input-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px 30px 25px;
    background: linear-gradient(to top, var(--bg-main) 60%, transparent);
    pointer-events: none;
  }

  .input-box {
    max-width: 850px;
    margin: 0 auto;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 8px 8px 8px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    pointer-events: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }

  .input-box:focus-within {
    border-color: var(--purple);
    box-shadow: 0 0 25px rgba(124, 58, 237, 0.35), 0 10px 40px rgba(0,0,0,0.4);
  }

  .input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    padding: 10px 0;
  }

  .input-box input::placeholder { color: var(--text-muted); }

  .input-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .input-btn:hover { background: var(--bg-bot-bubble); color: var(--text); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    border: none;
    color: white;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 15px rgba(124, 58, 237, 0.6);
  }

  .send-btn:hover { transform: scale(1.08); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== جوال ===== */
  @media (max-width: 768px) {
    .sidebar { width: 55px; }
    .side-icon { width: 38px; height: 38px; font-size: 17px; }
    .chat-area { padding: 15px 12px 120px; }
    .input-wrapper { padding: 10px 12px 20px; }
    .msg-bubble { max-width: calc(100% - 55px); }
    .top-text h3 { font-size: 13px; }
    .chips { justify-content: center; }
  }
</style>
</head>
<body>

<!-- القائمة الجانبية الضيقة -->
<aside class="sidebar">
  <div class="side-icon active" title="المحادثات">💬</div>
  <div class="side-icon" title="استكشاف">🧭</div>
  <div class="side-icon" title="السجل">🕐</div>
  <div class="side-icon" title="المفضلة">🔖</div>
  <div class="spacer"></div>
  <div class="side-icon" title="الإعدادات">⚙️</div>
  <div class="side-icon" title="حسابي">👤</div>
</aside>

<!-- المنطقة الرئيسية -->
<main class="main">
  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="top-info">
      <div class="top-logo">✨</div>
      <div class="top-text">
        <h3>مساعدك الذكي</h3>
        <p>متصل الآن</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="top-btn" title="بحث">🔍</button>
      <button class="top-btn" title="محادثة جديدة" onclick="newChat()">✏️</button>
      <button class="top-btn" title="المزيد">⋮</button>
    </div>
  </div>

  <!-- منطقة الرسائل -->
  <div class="chat-area" id="chatArea">
    <div class="messages" id="messages">
      <!-- شاشة الترحيب -->
      <div class="welcome" id="welcome">
        <div class="welcome-avatar">✨</div>
        <div class="welcome-bubble">
          <h2>مرحباً بك مجدداً 👋</h2>
          أنا مساعدك الذكي، جاهز لمساعدتك في أي شيء، سواء كان سؤالاً، فكرة، مساعدة في الدراسة، كتابة نصوص، أو حتى مجرد محادثة ممتعة.
          <br><br>
          كيف يمكنني مساعدتك اليوم؟
          <div class="chips">
            <div class="chip" onclick="quickAsk('أعطني أفكار إبداعية')">💡 أفكار وإبداع</div>
            <div class="chip" onclick="quickAsk('علمني شيئاً جديداً')">📚 تعلم</div>
            <div class="chip" onclick="quickAsk('ساعدني في الكتابة')">✍️ كتابة</div>
            <div class="chip" onclick="quickAsk('ساعدني في البرمجة')">💻 برمجة</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- شريط الإدخال العائم -->
  <div class="input-wrapper">
    <div class="input-box">
      <button class="input-btn" title="إرفاق ملف">+</button>
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
      <button class="input-btn" title="صورة">🖼️</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</main>

<script>
  const chatArea = document.getElementById('chatArea');
  const messagesEl = document.getElementById('messages');
  const welcomeEl = document.getElementById('welcome');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // ⚠️ ضع مفتاح Groq هنا
  const API_KEY = 'ضع_مفتاحك_هنا';
  const API_URL = 'https://api.groq.com/openai/v1/chat/completions';

  let history = [
    { role: 'system', content: 'أنت مساعد ذكي تجيب بالعربية بشكل واضح ومفيد.' }
  ];

  function quickAsk(text) {
    userInput.value = text;
    sendMessage();
  }

  function newChat() {
    history = [{ role: 'system', content: 'أنت مساعد ذكي تجيب بالعربية بشكل واضح ومفيد.' }];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = 'block';
  }

  function getTime() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    welcomeEl.style.display = 'none';
    addMessage(text, 'user');
    userInput.value = '';
    history.push({ role: 'user', content: text });

    const loading = addMessage('يكتب...', 'bot');
    sendBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: 'openai/gpt-oss-20b',
          messages: history,
          temperature: 0.7
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      const reply = data.choices[0].message.content;
      loading.querySelector('.msg-content').textContent = reply;
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      loading.querySelector('.msg-content').textContent = '❌ خطأ: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;

    const avatar = sender === 'user' ? '👤' : '✨';
    const time = getTime();

    let actionsHtml = '';
    if (sender === 'bot') {
      actionsHtml = `
        <div class="msg-actions">
          <button class="msg-action-btn" title="نسخ" onclick="copyText(this)">📋</button>
          <button class="msg-action-btn" title="إعجاب">👍</button>
          <button class="msg-action-btn" title="مشاركة">🔗</button>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-bubble">
        <div class="msg-content">${escapeHtml(text)}</div>
        ${actionsHtml}
        <div class="msg-time">${time}</div>
      </div>
    `;

    messagesEl.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function copyText(btn) {
    const content = btn.closest('.msg-bubble').querySelector('.msg-content').textContent;
    navigator.clipboard.writeText(content);
    btn.textContent = '✅';
    setTimeout(() => btn.textContent = '📋', 1500);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  userInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  userInput.focus();
</script>

</body>
</html>
